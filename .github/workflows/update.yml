name: Hourly Live News Auto-Update

on:
  schedule:
    - cron: '0 * * * *' # רץ אוטומטית כל שעה עגולה
  workflow_dispatch:      # מאפשר גם לחיצה ידנית להפעלה מתי שתרצה

jobs:
  run-updater:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        run: python update_site.py

      - name: Commit and push updated site
        run: |
          git config --global user.name "AI News Automation Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add .
          git commit -m "Auto-update live news: $(date)" || echo "No changes to commit"
          git push
